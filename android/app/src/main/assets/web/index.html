<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Creator Hub Live — Create. Connect. Go LIVE.</title>
<meta name="description" content="Creator Hub Live — a creator workspace for community, live streaming, publishing, teams and growth."/>
<meta name="theme-color" content="#14261d"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Creator Hub Live"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="assets/icon.svg"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="stylesheet" href="styles/app.css?v=6.0.6"/>
<link rel="stylesheet" href="styles/studio-edition.css?v=6.0.13"/>
<link rel="stylesheet" href="styles/nexus-edition.css?v=6.0.13"/>
<link rel="stylesheet" href="styles/platform-responsive.css?v=6.0.6"/>
<link rel="stylesheet" href="styles/chl-style-system.css?v=6.0.13"/>
<link rel="stylesheet" href="styles/platform-tools.css?v=6.0.10"/>

</head>
<body>
<div id="app"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center"><div class="spin"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.3/dist/livekit-client.umd.min.js"></script>
<script src="config.js?v=6.0.5"></script>
<script>
window.addEventListener('error', function (ev) {
  try {
    var app = document.getElementById('app');
    if (app && (!window.CHL || !window.CHL._guardsInstalled) && (!app.querySelector('#outlet') || app.querySelector('#outlet').children.length === 0)) {
      app.className = '';
      app.innerHTML = '<div style="max-width:560px;margin:48px auto;padding:22px;font-family:system-ui;color:#eaeaf2;background:#15151f;border-radius:14px"><div style="font-size:19px;font-weight:800;margin-bottom:8px">Creator Hub Live could not finish loading.</div><p style="opacity:.8;margin:0 0 16px">A component failed to start. Reload the app to recover.</p><button onclick="location.reload()" style="background:#6b5bff;color:#fff;border:0;padding:10px 16px;border-radius:10px;font-weight:700;cursor:pointer">Reload App</button></div>';
    }
  } catch (_) {}
});
</script>
<script src="src/core.js?v=6.0.5"></script>
<script src="src/ui.js?v=6.0.5"></script>
<script src="src/pages-auth.js?v=6.0.5"></script>
<script src="src/pages.js?v=6.0.5"></script>
<script src="src/pages-admin.js?v=6.0.5"></script>
<script src="src/pages-creator.js?v=6.0.15"></script>
<script src="src/pages-teams.js?v=6.0.13"></script>
<script src="src/pages-extra.js?v=6.0.5"></script>
<script src="src/pages-room.js?v=6.0.13"></script>
<script src="src/pages-settings.js?v=6.0.6"></script>
<script src="src/pages-accessibility.js?v=6.0.13"></script>
<script src="src/pages-account.js?v=6.0.13"></script>
<script src="src/pages-community.js?v=6.0.13"></script>
<script src="src/pages-wallet.js?v=6.0.14"></script>
<script src="src/pages-profile.js?v=6.0.13"></script>
<script src="src/livekit.js?v=6.0.13"></script>
<script src="src/studio-edition.js?v=6.0.13"></script>
<!-- Appearance is managed by the token-based Style Switcher below. -->
<script src="src/swipe-feed.js?v=6.0.6"></script>
<script src="src/pages-platform-tools.js?v=6.0.13"></script>
<script src="src/style-switcher.js?v=6.0.10"></script>
<script src="src/style-switcher-integration.js?v=6.0.10"></script>
<script src="src/chl-rank-achievements.js?v=6.0.11"></script>
<script>
try {
  var accessibility = JSON.parse(localStorage.getItem('chl_accessibility') || localStorage.getItem('chcn_accessibility') || '{}');
  if (accessibility.scale) document.documentElement.style.setProperty('--user-scale', String(accessibility.scale));
  document.documentElement.classList.toggle('reduce-motion', !!accessibility.motion);
  document.documentElement.classList.toggle('high-contrast', !!accessibility.contrast);
} catch (_) {}
try { window.CHL && window.CHL.start(); }
catch (e) {
  if (window.console) console.error(e);
  var a = document.getElementById('app');
  if (a) { a.className=''; a.innerHTML='<div style="max-width:560px;margin:48px auto;padding:22px;font-family:system-ui;color:#eaeaf2;background:#15151f;border-radius:14px"><div style="font-size:19px;font-weight:800;margin-bottom:8px">Creator Hub Live could not start.</div><p style="opacity:.8;margin:0 0 16px">'+(e&&e.message||'Unexpected error')+'</p><button onclick="location.reload()" style="background:#6b5bff;color:#fff;border:0;padding:10px 16px;border-radius:10px;font-weight:700;cursor:pointer">Reload App</button></div>'; }
}
</script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js?v=6.0.14').catch(function(){}); });
}
</script>
</body>
</html>
