<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Creator Hub Live — Create. Connect. Go LIVE.</title>
<meta name="description" content="Creator Hub Live — a real international live-streaming and creator platform. Go live, send gifts, grow your audience."/>
<meta name="theme-color" content="#0b0b12"/>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="assets/icon.svg"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="stylesheet" href="styles/app.css"/>
</head>
<body>
<div id="app">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center">
    <div class="spin"></div>
  </div>
</div>

<!-- Supabase JS (UMD global) from CDN. If offline, the UI still loads and shows a setup notice. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.3/dist/livekit-client.umd.min.js"></script>

<!-- Browser-safe configuration -->
<script src="config.js"></script>

<!-- App (plain scripts; central core initializes before dependent modules) -->
<script>
  // Earliest possible guard: if any module fails to parse/execute, the user
  // still gets a visible, recoverable message instead of a black screen.
  window.addEventListener('error', function (ev) {
    try {
      var app = document.getElementById('app');
      if (app && (!window.CHL || !window.CHL._guardsInstalled) && (!app.querySelector('#outlet') || app.querySelector('#outlet').children.length === 0)) {
        app.className = '';
        app.innerHTML = '<div style="max-width:560px;margin:48px auto;padding:22px;font-family:system-ui;color:#eaeaf2;background:#15151f;border-radius:14px"><div style="font-size:19px;font-weight:800;margin-bottom:8px">Creator Hub Live could not finish loading.</div><p style="opacity:.8;margin:0 0 16px">A component failed to start. You can reload the app to recover.</p><button onclick="location.reload()" style="background:#6b5bff;color:#fff;border:0;padding:10px 16px;border-radius:10px;font-weight:700;cursor:pointer">Reload App</button></div>';
      }
    } catch (_) {}
  });
</script>
<script src="src/core.js"></script>
<script src="src/ui.js"></script>
<script src="src/pages-auth.js"></script>
<script src="src/pages.js"></script>
<script src="src/pages-admin.js"></script>
<script src="src/pages-creator.js"></script>
<script src="src/pages-extra.js"></script>
<script src="src/pages-room.js"></script>
<script src="src/pages-settings.js"></script>
<script src="src/pages-wallet.js"></script>
<script src="src/livekit.js"></script>
<script>
  try { 
    window.CHL && window.CHL.start(); 
  } catch (e) { 
    if (window.console) console.error(e); 
    var a = document.getElementById('app'); 
    if (a) { 
      a.className=''; 
      a.innerHTML='<div style="max-width:560px;margin:48px auto;padding:22px;font-family:system-ui;color:#eaeaf2;background:#15151f;border-radius:14px"><div style="font-size:19px;font-weight:800;margin-bottom:8px">Creator Hub Live could not start.</div><p style="opacity:.8;margin:0 0 16px">'+(e&&e.message||'Unexpected error')+'</p><button onclick="location.reload()" style="background:#6b5bff;color:#fff;border:0;padding:10px 16px;border-radius:10px;font-weight:700;cursor:pointer">Reload App</button></div>'; 
    } 
  }
</script>

<script>
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>
</body>
</html>
