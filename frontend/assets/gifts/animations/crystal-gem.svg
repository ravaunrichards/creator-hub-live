<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320" role="img" aria-label="Animated Crystal Gem">
<defs><radialGradient id="b"><stop stop-color="#cbd5e1" stop-opacity=".76"/><stop offset="1" stop-color="#080c18" stop-opacity="0"/></radialGradient><linearGradient id="r"><stop stop-color="#475569"/><stop offset="1" stop-color="#ffffff"/></linearGradient></defs>
<circle cx="210" cy="145" r="130" fill="url(#b)"/>
<circle cx="210" cy="145" r="87" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="22 12"><animateTransform attributeName="transform" type="rotate" from="0 210 145" to="360 210 145" dur="4.7s" repeatCount="indefinite"/></circle>
