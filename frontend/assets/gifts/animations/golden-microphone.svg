<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320" role="img" aria-label="Animated Golden Microphone">
<defs><radialGradient id="b"><stop stop-color="#f97316" stop-opacity=".76"/><stop offset="1" stop-color="#080c18" stop-opacity="0"/></radialGradient><linearGradient id="r"><stop stop-color="#7c2d12"/><stop offset="1" stop-color="#ffedd5"/></linearGradient></defs>
<circle cx="210" cy="145" r="130" fill="url(#b)"/>
<circle cx="210" cy="145" r="69" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="24 12"><animateTransform attributeName="transform" type="rotate" from="0 210 145" to="360 210 145" dur="2.9s" repeatCount="indefinite"/></circle>
<circle cx="210" cy="145" r="104" fill="none" stroke="#ffedd5" stroke-opacity=".8" stroke-width="2" stroke-dasharray="2 14"><animateTransform attributeName="transform" type="rotate" from="360 210 145" to="0 210 145" dur="3.4s" repeatCount="indefinite"/></circle>
