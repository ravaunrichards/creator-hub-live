<path d="M70 220 Q210 203 350 220" fill="none" stroke="url(#r)" stroke-width="2" stroke-opacity=".7"/>
<text x="210" y="260" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-weight="850" font-size="18">Golden Microphone</text>
<text x="210" y="284" text-anchor="middle" fill="#ffedd5" font-family="system-ui,sans-serif" font-size="12" letter-spacing="2">550 COINS</text></svg>
