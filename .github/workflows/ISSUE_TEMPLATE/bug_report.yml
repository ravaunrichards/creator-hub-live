name: Bug report
description: Report a reproducible Creator Hub Live defect with enough evidence to investigate safely.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, access tokens, private keys, full payment details, or private message contents. Redact screenshots/logs."
  - type: textarea
    id: impact
    attributes:
      label: User impact
      description: Who is affected and which capability is failing? Mention possible account, security, LIVE, or payment impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List exact actions and expected versus observed results.
      placeholder: "1. Open... 2. Select... 3. Observe..."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Route, build/commit, device/OS, browser/WebView, timestamp/timezone; say production/staging/local/mocked/unknown.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Error code, request ID, sanitized logs, or screenshot. Never paste secrets.
  - type: dropdown
    id: severity
    attributes:
      label: Suspected severity
      options:
        - SEV-1 — security/privacy/financial integrity or broad outage
        - SEV-2 — core capability materially degraded
        - SEV-3 — limited defect with workaround
        - SEV-4 — low-impact/cosmetic
    validations:
      required: true
