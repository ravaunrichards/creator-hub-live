name: Feature request
description: Propose a CHL capability using clear user outcomes, data/security considerations, and testable acceptance criteria.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who needs this and what cannot they do today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome and acceptance criteria
      description: What should be observable when this works? Include error/empty/unauthorized states.
    validations:
      required: true
  - type: textarea
    id: existing
    attributes:
      label: Existing behavior / related features
      description: What have you checked already? List relevant route/docs/tests or explain what remains unknown.
  - type: dropdown
    id: risk
    attributes:
      label: Risk area
      options:
        - UI/copy only
        - Account/profile/social data
        - Messaging/notifications
        - LIVE/realtime/media
        - Database/RLS/authentication
        - Wallet/coins/diamonds/gifts/payments/payouts
        - External provider/integration
        - Unknown — needs audit
    validations:
      required: true
  - type: textarea
    id: safeguards
    attributes:
      label: Privacy, security, data and recovery
      description: What permissions/data change? How will it be tested, measured and safely disabled or reversed?
  - type: textarea
    id: evidence
    attributes:
      label: Reference material
      description: Screenshots or platform-pattern references are welcome if they are redacted. Do not imply an external API/integration is available without verifying its current official documentation.
