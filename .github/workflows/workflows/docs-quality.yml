name: CHL Documentation Quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/**'
      - 'scripts/validate-docs.mjs'
      - 'DOCS-AND-WORKFLOWS-MANUAL-INSTALL.md'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/**'
      - 'scripts/validate-docs.mjs'
      - 'DOCS-AND-WORKFLOWS-MANUAL-INSTALL.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chl-docs-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docs:
    name: Validate documentation and local links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run documentation validator
        run: node scripts/validate-docs.mjs
